name: fitpath
description: "FitPath - local-first fitness, nutrition and workout tracker"
publish_to: 'none'

# versionName+versionCode for Android.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

# All MVP packages are added here by issue #1 so feature work never has to
# touch this file. Need another package? Open a small dedicated PR.
dependencies:
  flutter:
    sdk: flutter

  # State management and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Local persistence (SQLite via Drift)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Network (Open Food Facts) and serialization
  dio: ^5.11.1
  json_annotation: ^4.12.0
  connectivity_plus: ^7.3.2

  # Charts, formatting, utilities
  fl_chart: ^1.3.0
  intl: ^0.20.3
  collection: ^1.19.1

  # Backup export/import and app info
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (generated files are not committed)
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  json_serializable: ^6.15.2

  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/   # bundled starter catalogs (#12, #16)
    - assets/icons/  # macro and UI icons (#6)
    - assets/icon/   # launcher icon source (#44)

  # Fonts are registered by #2 (Theme and design tokens): Barlow and Barlow Condensed.
  # fonts:
